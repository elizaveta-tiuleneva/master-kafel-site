# Сборка и публикация сайта на GitHub Pages при каждом push в main.
#
# Нужно один раз настроить в репозитории:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Secrets and variables → Actions → Variables:
#     VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
# Секретные ключи (sb_secret_..., Telegram, DeepL) сюда не добавляются —
# они хранятся только в Supabase.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check settings
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Добавьте VITE_SUPABASE_URL и VITE_SUPABASE_PUBLISHABLE_KEY в Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*) echo "::error::Указан секретный ключ вместо publishable — замените его"; exit 1 ;;
          esac

      - run: npm ci

      - name: Build
        env:
          # Сайт открывается из подпапки /<имя-репозитория>/, кроме репозитория <user>.github.io.
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # GitHub Pages отдаёт 404.html на неизвестные адреса — копия index.html
      # позволяет React Router открыть /portfolio/... и /admin при прямом переходе
      # и при обновлении страницы.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
